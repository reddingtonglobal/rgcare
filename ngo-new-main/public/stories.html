  <!-- Inline loading screen – shown immediately, hidden once React mounts -->
  <style>
    #rg-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:16px;transition:opacity .3s}
    #rg-loader.done{opacity:0;pointer-events:none}
    .rg-spin-ring{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#2B6CB0;border-radius:50%;animation:rg-spin .7s linear infinite}
    @keyframes rg-spin{to{transform:rotate(360deg)}}
    #rg-loader p{font-family:sans-serif;font-size:14px;color:#718096;margin:0}
  </style>
  <div id="rg-loader"><div class="rg-spin-ring"></div><p>Loading…</p></div>
  <div id="root"></div>
  <script>
    // Hide loader once React has rendered something into #root
    var _rgl = setInterval(function(){
      var r = document.getElementById('root');
      if(r && r.children.length > 0){
        document.getElementById('rg-loader').classList.add('done');
        clearInterval(_rgl);
      }
    }, 80);
    setTimeout(function(){ var l=document.getElementById('rg-loader'); if(l) l.classList.add('done'); }, 8000);
  </script>

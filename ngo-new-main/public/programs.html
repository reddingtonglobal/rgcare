<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programs | RG Care Foundation — Education, Healthcare, Skills, Community</title>
  <meta name="description" content="Explore RG Care Foundation's programs in education, healthcare, skill development and community empowerment — with objectives, methodology, impact metrics and ways to help." />
  <meta name="theme-color" content="#2B6CB0" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="rg-styles.css" />
  <link rel="stylesheet" href="rg-components.css" />
  <link rel="stylesheet" href="rg-pages.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- Inline loading screen – shown immediately, hidden once React mounts -->
  <style>
    #rg-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:16px;transition:opacity .3s}
    #rg-loader.done{opacity:0;pointer-events:none}
    .rg-spin-ring{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#2B6CB0;border-radius:50%;animation:rg-spin .7s linear infinite}
    @keyframes rg-spin{to{transform:rotate(360deg)}}
    #rg-loader p{font-family:sans-serif;font-size:14px;color:#718096;margin:0}
  </style>
  <div id="rg-loader"><div class="rg-spin-ring"></div><p>Loading…</p></div>
  <div id="root"></div>
  <script>
    // Hide loader once React has rendered something into #root
    var _rgl = setInterval(function(){
      var r = document.getElementById('root');
      if(r && r.children.length > 0){
        document.getElementById('rg-loader').classList.add('done');
        clearInterval(_rgl);
      }
    }, 80);
    setTimeout(function(){ var l=document.getElementById('rg-loader'); if(l) l.classList.add('done'); }, 8000);
  </script>
  <script src="image-slot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="rg-data.js"></script>
  <script src="rg-pagedata.js"></script>
  <script type="text/babel" src="rg-bits.jsx"></script>
  <script type="text/babel" src="rg-nav-hero.jsx"></script>
  <script type="text/babel" src="rg-footer.jsx"></script>
  <script type="text/babel" src="rg-page.jsx"></script>
  <script type="text/babel" src="page-programs.jsx"></script>
  <!-- GSAP animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="rg-animations.js"></script>
</body>
</html>

# Nginx config for rgcare.in
# Place this file at: /etc/nginx/sites-available/rgcare.in
# Then: ln -s /etc/nginx/sites-available/rgcare.in /etc/nginx/sites-enabled/rgcare.in
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name rgcare.in www.rgcare.in;
    return 301 https://rgcare.in$request_uri;
}

server {
    listen 443 ssl;
    server_name www.rgcare.in;

    ssl_certificate     /etc/letsencrypt/live/rgcare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgcare.in/privkey.pem;

    return 301 https://rgcare.in$request_uri;
}

server {
    listen 443 ssl;
    server_name rgcare.in;

    ssl_certificate     /etc/letsencrypt/live/rgcare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgcare.in/privkey.pem;

    # Frontend static files root
    root /root/rgcare/ngo-new-main/public;
    index index.html;

    # ── Proxy /api/* to Node.js backend ──────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Static asset caching ──────────────────────────────────────────
    location ~* \.(css|js|jsx|png|jpg|jpeg|webp|svg|gif|avif|woff2|woff|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip compression ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Clean URLs (serve /about → about.html) ────────────────────────
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
}
